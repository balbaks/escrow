[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "escrow"
version = "0.1.1"
description = "Vets a Python package before real install by installing and importing it in a sandbox first, and reporting what it does."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "escrow contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
escrow = "escrow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["escrow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
